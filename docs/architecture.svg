<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#91e0c7"/>
    </marker>
    <linearGradient id="relayStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#91e0c7"/>
      <stop offset="1" stop-color="#7fa8e0"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1200" height="660" fill="#10151e"/>
  <rect x="16" y="16" width="1168" height="628" rx="18" fill="none" stroke="#303b49" stroke-width="1.5"/>

  <text x="600" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="#eef2f6">happ-relay-cloudflare · happ-relay-vercel</text>
  <text x="600" y="96" text-anchor="middle" font-size="16" fill="#a3afbf">many devices — one HWID at the panel</text>

  <!-- Devices -->
  <text x="150" y="160" text-anchor="middle" font-size="13" fill="#a3afbf" font-family="Consolas, monospace">YOUR DEVICES</text>
  <rect x="40" y="180" width="220" height="64" rx="12" fill="#19202b" stroke="#303b49" stroke-width="1.5"/>
  <text x="150" y="207" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2f6">iPhone · Happ</text>
  <text x="150" y="228" text-anchor="middle" font-size="12" fill="#a3afbf">its own HWID — ignored by the panel</text>
  <rect x="40" y="262" width="220" height="64" rx="12" fill="#19202b" stroke="#303b49" stroke-width="1.5"/>
  <text x="150" y="289" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2f6">Android · v2RayTun</text>
  <text x="150" y="310" text-anchor="middle" font-size="12" fill="#a3afbf">its own HWID — ignored by the panel</text>
  <rect x="40" y="344" width="220" height="64" rx="12" fill="#19202b" stroke="#303b49" stroke-width="1.5"/>
  <text x="150" y="371" text-anchor="middle" font-size="15" font-weight="600" fill="#eef2f6">PC · Happ Desktop</text>
  <text x="150" y="392" text-anchor="middle" font-size="12" fill="#a3afbf">its own HWID — ignored by the panel</text>

  <line x1="266" y1="272" x2="424" y2="272" stroke="#91e0c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="345" y="258" text-anchor="middle" font-size="12" fill="#91e0c7" font-family="Consolas, monospace">GET /&lt;secret&gt;/s/&lt;target&gt;</text>

  <!-- Relay -->
  <text x="600" y="160" text-anchor="middle" font-size="13" fill="#a3afbf" font-family="Consolas, monospace">RELAY — YOUR DOMAIN</text>
  <rect x="430" y="180" width="340" height="148" rx="14" fill="#19202b" stroke="url(#relayStroke)" stroke-width="2"/>
  <text x="600" y="214" text-anchor="middle" font-size="17" font-weight="700" fill="#91e0c7">happ-relay-cloudflare · happ-relay-vercel</text>
  <text x="600" y="240" text-anchor="middle" font-size="13" fill="#eef2f6">Cloudflare Workers · or · Vercel</text>
  <rect x="452" y="258" width="296" height="30" rx="8" fill="#111720" stroke="#303b49"/>
  <text x="600" y="278" text-anchor="middle" font-size="12" fill="#a3afbf" font-family="Consolas, monospace">x-hwid: UE42LJXu4DbiCaBv (fixed)</text>
  <rect x="452" y="294" width="296" height="26" rx="8" fill="#111720" stroke="#303b49"/>
  <text x="600" y="312" text-anchor="middle" font-size="12" fill="#a3afbf" font-family="Consolas, monospace">user-agent: Happ/1.16.0 (…)</text>
  <text x="600" y="344" text-anchor="middle" font-size="12" fill="#a3afbf">secret path · ALLOWED_HOSTS · 2 MiB / 15 s caps</text>

  <line x1="776" y1="254" x2="874" y2="254" stroke="#91e0c7" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="825" y="240" text-anchor="middle" font-size="12" fill="#91e0c7" font-family="Consolas, monospace">200 OK</text>

  <!-- Panel -->
  <text x="1000" y="160" text-anchor="middle" font-size="13" fill="#a3afbf" font-family="Consolas, monospace">PANEL (REMNAWAVE…)</text>
  <rect x="880" y="180" width="260" height="136" rx="12" fill="#19202b" stroke="#303b49" stroke-width="1.5"/>
  <text x="1010" y="212" text-anchor="middle" font-size="16" font-weight="700" fill="#eef2f6">VPN panel</text>
  <text x="1010" y="238" text-anchor="middle" font-size="13" fill="#a3afbf">device list:</text>
  <rect x="900" y="252" width="220" height="32" rx="8" fill="#91e0c70f" stroke="#91e0c755"/>
  <text x="1010" y="273" text-anchor="middle" font-size="13" fill="#91e0c7">1 device · UE42LJXu4DbiCaBv</text>
  <text x="1010" y="304" text-anchor="middle" font-size="12" fill="#a3afbf">all apps share this identity</text>

  <text x="1010" y="344" text-anchor="middle" font-size="12" fill="#a3afbf">subscription: vless / vmess / ss …</text>
  <text x="1010" y="364" text-anchor="middle" font-size="12" fill="#a3afbf">auto-updates for every device</text>

  <!-- Bottom strip -->
  <rect x="40" y="500" width="1100" height="120" rx="14" fill="#141b25" stroke="#303b49" stroke-width="1"/>
  <text x="70" y="540" font-size="14" font-weight="600" fill="#eef2f6">Why devices don&#8217;t take extra slots</text>
  <text x="70" y="568" font-size="13" fill="#a3afbf">The panel counts unique x-hwid values. The relay answers every app with one fixed identity,</text>
  <text x="70" y="590" font-size="13" fill="#a3afbf">so 10 phones = 1 device. Secret path protects the link; ALLOWED_HOSTS limits target hosts.</text>
</svg>
